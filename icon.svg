<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer glowing ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#cardGrad)" stroke-width="4" opacity="0.3" />

  <!-- Business Card Icon Base -->
  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="96" y="144" width="320" height="224" rx="24" fill="url(#cardGrad)" />
    
    <!-- Design Elements on Card -->
    <!-- Magnetic strip or dark accent header -->
    <rect x="96" y="144" width="320" height="48" rx="0" fill="#000" opacity="0.15" />
    
    <!-- User Avatar Icon on card -->
    <circle cx="160" cy="272" r="32" fill="#ffffff" opacity="0.9" />
    <path d="M 128 336 A 32 32 0 0 1 192 336 Z" fill="#ffffff" opacity="0.9" />

    <!-- Text Lines on Card -->
    <rect x="220" y="244" width="140" height="12" rx="6" fill="#ffffff" opacity="0.9" />
    <rect x="220" y="268" width="100" height="8" rx="4" fill="#ffffff" opacity="0.6" />
    <rect x="220" y="288" width="120" height="8" rx="4" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Tag indicator in the corner -->
  <path d="M 380 120 L 410 120 L 410 150 Z" fill="#d946ef" />
  <circle cx="395" cy="135" r="4" fill="#ffffff" />
</svg>
